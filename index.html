    <style>
        :root {
    --gold-primary: #c5a059;
    --gold-hover: #dfb76c;
    --dark-surface: #0e0e0e;
    --border-color: #272727;
}

body {
    margin: 0;
    background-color: #050505;
    font-family: 'Montserrat', sans-serif;
    color: #f1f1f1;
}

/* عمود الصورة اليسار (ملء كامل بدون تكرار بتدرج ناعم) */
.bg-image-col {
    background-image: url("rich\ man.png");
    background-repeat: no-repeat !important;
    background-size: cover !important;
    background-position: center center;
    position: relative;
    min-height: 100vh;
}

/* طبقة ظل ناعمة تدمج الصورة مع الجانب الداكن بسلاسة */
.image-overlay {
    background: linear-gradient(to right, rgba(0, 0, 0, 0.1), #050505);
}

/* تنسيق قسم الفورم */
.form-section {
    background-color: #050505;
}

#info {
    width: 100%;
    max-width: 440px;
    background: #0f0f10;
    border: 1px solid #1f1f20;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}

/* الخطوط والعناوين */
.luxury-title {
    font-family: 'Cinzel', serif;
    letter-spacing: 3px;
    font-weight: 700;
    color: #ffffff;
    font-size: 1.4rem;
}

.luxury-subtitle {
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--gold-primary);
    font-weight: 600;
    display: block;
}

/* عناصر الإدخال والتسميات */
.luxury-label {
    color: #c9c9c9;
    font-size: 0.82rem;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.luxury-input {
    background-color: #161617 !important;
    border: 1px solid var(--border-color) ;
    color: #ffffff !important;
    border-radius: 4px;
    font-size: 0.9rem;
    padding: 0.65rem 0.9rem;
    transition: all 0.3s ease;
}

.luxury-input:focus {
    background-color: #1a1a1c !important;
    border-color: var(--gold-primary) !important;
    box-shadow: 0 0 10px rgba(197, 160, 89, 0.25) !important;
}

.luxury-input::placeholder {
    color: #555555;
    font-size: 0.85rem;
}

/* أخطاء الإدخال */
#name-error, 
#email-error, 
#number-error, 
#pass-error,
#form-error {
    display: none;
    font-size: 0.75rem;
    color: #e05252 !important;
}

/* الزر المطابق لزر EXPLORE NOW في الصورة */
.luxury-btn {
    background: linear-gradient(135deg, #a8833e, #6e5223);
    color: #ffffff;
    border: 1px solid var(--gold-primary);
    border-radius: 2px;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.3s ease;
}

.luxury-btn:hover {
    background: linear-gradient(135deg, #c5a059, #8f6c32);
    border-color: #ffd885;
    color: #ffffff;
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
}

/* زر الساعة التفاعلي داخل الحقل */
.watch-toggle-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    z-index: 5;
}

/* رسم الساعة الذهبي */
.watch-svg {
    fill: none;
    stroke: var(--gold-primary, #c5a059);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 0.3s ease;
}

.watch-svg .watch-center-point {
    fill: var(--gold-primary, #c5a059);
}

/* علامات الأرقام: مخفية في الوضع العادي */
.watch-ticks {
    opacity: 0;
    transition: opacity 0.3s ease;
}

/* حالة النشاط (عند إظهار كلمة المرور): تظهر علامات الأرقام ويزداد التوهج الذهبي */
.watch-toggle-btn.active .watch-ticks {
    opacity: 1;
}

.watch-toggle-btn.active .watch-svg {
    stroke: #ffd885;
    filter: drop-shadow(0 0 5px rgba(223, 183, 108, 0.6));
}

.watch-toggle-btn:hover .watch-svg {
    stroke: var(--gold-hover, #dfb76c);
}
.rolex-mini {

    }

<body class="bg-black text-light">

            <div class="col-12 col-md-6 d-flex justify-content-center align-items-center p-4 form-section">
                
                <div id="info" class="p-4 p-md-5 rounded-4">
                    
                    <!-- ترويسة النموذج بأسلوب Rolex -->
                    <div class="text-center mb-4">
                        <span class="luxury-subtitle"><div class="rolex-mini">
    <svg class="crown" viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg">

<div id="pass-div" class="mb-4">

<p class="luxury-title mt-0">Already have an account? <a href="login.html" class="text-decoration-none" style="color: #c5a059;"> Sign in</a></p>

<script>const togglePassBtn = document.getElementById("togglePassBtn");

togglePassBtn.addEventListener("click", () => {
    // التحقق من نوع الحقل الحالي
    const isPassword = pass.getAttribute("type") === "password";

    if (isPassword) {
        pass.setAttribute("type", "text");
        togglePassBtn.classList.add("active"); // إظهار علامات الساعة وتوهجها
    } else {
        pass.setAttribute("type", "password");
        togglePassBtn.classList.remove("active"); // إخفاء علامات الساعة
    }
});



// Validate Functions

function validate_name(name) {
    name = name.trim();
    let name_pattern = /^[a-zA-Z\s]{3,15}$/;
    return name_pattern.test(name);
}
function validate_email(email) {
    email = email.trim();
    let email_pattern = /^\w+@[a-zA-Z]+\.(com|edu|org)$/;
    return email_pattern.test(email);
}
function validate_number(number) {
    number = number.trim();
    let number_pattern = /^\+2(010|011|012|015)\d{8}$/;
    return number_pattern.test(number);
}
function validate_pass(password) {
    password = password.trim();
    let password_pattern = /^[a-zA-Z]+@\d+$/;
    return password_pattern.test(password);
}



// catch elements & Event Listener

form = document.forms[0];
former = document.getElementById("form-error");
formValue = false;


Name = document.getElementById("name");
Nameer = document.getElementById("name-error");
NameValue = false

email = document.getElementById("email");
emailer = document.getElementById("email-error");
emailValue = false;

number = document.getElementById("number");
numberer = document.getElementById("number-error");
numberValue = false;

pass = document.getElementById("pass");
passer = document.getElementById("pass-error");
passValue = false;


Name.addEventListener("input", (e) => {
    if (validate_name(Name.value)) {
        Name.style.border = "4px solid green";
        Nameer.style.display = "none";
        NameValue = true;
    }
    else {
        Nameer.style.display = "block";
        Name.style.border = "4px solid red";
        NameValue = false;
    }
})
email.addEventListener("input", (e) => {
    if (validate_email(email.value)) {
        email.style.border = "4px solid green";
        emailer.style.display = "none";
        emailValue = true;
    }
    else {
        emailer.style.display = "block";
        email.style.border = "4px solid red";
        emailValue = false;
    }
})
number.addEventListener("input", (e) => {
    if (validate_number(number.value)) {
        number.style.border = "4px solid green";
        numberer.style.display = "none";
        numberValue = true;
    }
    else {
        numberer.style.display = "block";
        number.style.border = "4px solid red";
        numberValue = false;
    }
})
pass.addEventListener("input", (e) => {
    if (validate_pass(pass.value)) {
        pass.style.border = "4px solid green";
        passer.style.display = "none";
        passValue = true;
    }
    else {
        passer.style.display = "block";
        pass.style.border = "4px solid red";
        passValue = false;
    }
})

form.addEventListener("submit" , (e)=>{
    if(NameValue & emailValue & numberValue & passValue){
        e.preventDefault();
        former.style.display = "none";
// بنخزن البيانات عشان نعرف نتحكم فيها
            const data = {
                name: Name.value,
                email: email.value,
                number:number.value,
                password:pass.value
            }
            // حولنا البيانات لـ أسترينج عشان نقدر نبعتها
            const jsondata = JSON.stringify(data);
            // بنبعت البيانات
            const xhr = new XMLHttpRequest();


            xhr.open("POST", "https://6ab193d69751d2b03e6d5aaa.mockapi.io/project/users");

            // بنعدل نوع البيانات عشان مش بيقبل من فورم
            xhr.setRequestHeader("content-type", "application/json");


            xhr.send(jsondata);

            xhr.addEventListener("readystatechange", (e) => {
                if (xhr.readyState == 4) {
                     document.location.assign("login.html");
                    

                }
            })
        
        
    }
    else{
        e.preventDefault();
        former.style.display = "inline-block";
    }
})












</script>
