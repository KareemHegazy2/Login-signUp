<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolex - Create Account</title>
    <!-- خط Cinzel للأناقة والفخامة المماثلة لـ Rolex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Assests/css/bootstrap.css">
    <link rel="stylesheet" href="../Assests/css/signup.css">
</head>

<body class="bg-black text-light">

    <div class="container-fluid min-vh-100 p-0">
        <div class="row g-0 min-vh-100">

            <!-- النصف الأيسر: الصورة بالكامل بدون تكرار ومطابقة لنمط الهيرو -->
            <div class="col-md-6 d-none d-md-block p-0 bg-image-col">
                <div class="image-overlay w-100 h-100"></div>
            </div>

            <!-- النصف الأيمن: نموذج التسجيل الفخم -->
            <div class="col-12 col-md-6 d-flex justify-content-center align-items-center p-4 form-section">
                
                <div id="info" class="p-4 p-md-5 rounded-4">
                    
                    <!-- ترويسة النموذج بأسلوب Rolex -->
                    <div class="text-center mb-4">
                        <span class="luxury-subtitle">TIMELESS PRECISION</span>
                        <h2 class="luxury-title mt-1">CREATE ACCOUNT</h2>
                    </div>

                    <form action="">
                        
                        <div id="name-div" class="mb-3">
                            <label for="name" class="form-label luxury-label">Full Name</label>
                            <input name="name" type="text" id="name" placeholder="Enter Your Name" class="form-control luxury-input">
                            <p id="name-error" class="text-danger small mt-1">Invalid Name, Please Try Again</p>
                        </div>

                        <div id="email-div" class="mb-3">
                            <label for="email" class="form-label luxury-label">Email Address</label>
                            <input name="email"  type="email" id="email" placeholder="mark@example.com" class="form-control luxury-input">
                            <p id="email-error" class="text-danger small mt-1">Invalid Email, Please Try Again</p>
                        </div>

                        <div id="number-div" class="mb-3">
                            <label for="number" class="form-label luxury-label">Phone Number</label>
                            <input name="email" type="tel" id="number" placeholder="+201000000000" class="form-control luxury-input">
                            <p id="number-error" class="text-danger small mt-1">Invalid Number, Please Try Again</p>
                        </div>

<div id="pass-div" class="mb-4">
    <label for="pass" class="form-label luxury-label">Password</label>
    
    <div class="position-relative d-flex align-items-center">
        <input type="password" id="pass" placeholder="Letters@Numbers" class="form-control luxury-input pe-5">
        
        <!-- زر أيقونة الساعة التفاعلي -->
        <button type="button" id="togglePassBtn" class="watch-toggle-btn" aria-label="Toggle password visibility">
            <svg id="watchIcon" viewBox="0 0 24 24" width="22" height="22" class="watch-svg">
                <!-- إطار الساعة الخارجي -->
                <circle cx="12" cy="12" r="9" class="watch-rim" />
                
                <!-- علامات/أرقام الساعة (مخفية افتراضياً وتظهر عند الضغط) -->
                <g class="watch-ticks">
                    <!-- 12 o'clock -->
                    <line x1="12" y1="4.5" x2="12" y2="6.5" />
                    <!-- 3 o'clock -->
                    <line x1="19.5" y1="12" x2="17.5" y2="12" />
                    <!-- 6 o'clock -->
                    <line x1="12" y1="19.5" x2="12" y2="17.5" />
                    <!-- 9 o'clock -->
                    <line x1="4.5" y1="12" x2="6.5" y2="12" />
                </g>

                <!-- عقارب الساعة ونقطة المنتصف -->
                <circle cx="12" cy="12" r="1.2" class="watch-center-point" />
                <line x1="12" y1="12" x2="12" y2="7.5" class="watch-hand hand-hour" />
                <line x1="12" y1="12" x2="15.5" y2="12" class="watch-hand hand-minute" />
            </svg>
        </button>
    </div>

    <p id="pass-error" class="text-danger small mt-1">Weak password. It must follow this format: letters@numbers</p>
</div>

                        <!-- زر مصمم بنفس نمط Explore Now -->
                        <button type="submit" class="btn luxury-btn w-100 py-2">REGISTER NOW</button>
                        <p id="form-error" class="text-danger small mt-1" >Can Not Submit , Enter a Valid Data</p>
                    </form>
<p class="luxury-title mt-0">Already have an account? <a href="../Login/login.html" class="text-decoration-none" style="color: #c5a059;"> Sign in</a></p>
                </div>
                

            </div>

        </div>
    </div>

</body>
<script src="../Assests/js/signup.js"></script>
</html>
